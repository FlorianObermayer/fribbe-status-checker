# markdownlint-cli2 configuration
# Warnings treated as errors in CI (--no-progress exit code)

config:
  # Disable line-length — prose uses single-line paragraphs, code convention is 120
  line-length: false

globs:
  - "**/*.md"

ignores:
  - ".venv/**"
  - "node_modules/**"
  - "fribbe_status_checker.egg-info/**"
  # OpenSpec artifacts deliberately start with "## " (schema-defined), so MD041 does not apply.
  - "openspec/**"
  # Vendor-generated security assessment reports are linted by their own tooling.
  - "strix-reports/**"
  # OpenSpec CLI-generated agent/prompt/skill docs follow their own formatting conventions.
  - ".github/agents/**"
  - ".github/prompts/**"
  - ".github/skills/**"
